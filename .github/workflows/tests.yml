name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# a new push to the same branch or PR cancels the run still going
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the scripts are written and tested on macOS only
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.9: the oldest supported (the Command Line Tools' python3);
        # 3.x: the latest release
        python-version: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python --version
      - run: python -m unittest discover -s tests -v
