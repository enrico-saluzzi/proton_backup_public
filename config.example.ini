# Profiles for the proton_backup scripts: one section per profile,
# named [<script> <profile>], e.g. [drive-compare dropbox] or [file-backup ssd].
# Run:   ./<script>.py <profile>   (or just ./<script>.py with a single profile)
# Edit:  ./<script>.py --setup <profile>, or by hand.
# Settings in [DEFAULT] apply to every profile.
#
# photo-prune.py and photo-redate.py take the backup folder from the
# [photo-backup <name>] profile with the same name; their own sections are
# optional.
#
# Copy this file to ~/.config/proton-backup/config.ini (or pass it with
# --config), or let --setup create it. Comments start with ';' or '#'.

[DEFAULT]
; the Proton folder to work on (/my-files is the whole Drive)
proton_root = /my-files

[drive-compare dropbox]
; the folder to compare with Proton (e.g. ~/Dropbox, or a copy on a disk)
folder = ~/Dropbox
; top-level subfolders to skip, comma-separated, exact names
exclude = Camera Uploads
; content = identical files verified by sha1 (slower, certain) | size = trust name and size
compare_by = content
; same file, different content: proton = keep Proton's, nothing to do | folder = copy the folder's over Proton's | newer = the most recently modified wins | ask = list it among the files to decide
winner = proton
; files found on Proton under another path or name: hide = count only | list = show them in the report
moved = hide
; files only on Proton: hide = count only | list = show them in the report
proton_only = hide
; yes = also put the files missing on Proton in the copy script
copy_script = no
; ask file by file at the end when at most this many need a decision (0 = never)
review_max = 20
; paths deleted from Proton on purpose, one per line, never reported again (empty = ~/.config/proton-backup/ignore-<profile>.txt)
ignore_file = 

[drive-compare disk]
; the folder to compare with Proton (e.g. ~/Dropbox, or a copy on a disk)
folder = /Volumes/MyBackupDisk/old-cloud-copy
; same file, different content: proton = keep Proton's, nothing to do | folder = copy the folder's over Proton's | newer = the most recently modified wins | ask = list it among the files to decide
winner = ask
; files found on Proton under another path or name: hide = count only | list = show them in the report
moved = list
; yes = also put the files missing on Proton in the copy script
copy_script = yes
; the local folder synced by the Proton Drive app matching proton_root (empty = found automatically)
proton_folder = 

[file-backup ssd]
; the backup folder, e.g. on an external disk
dest = /Volumes/MyBackupDisk/proton-files
; yes = recompute the sha1 of every local file: the only check that catches a corrupted file of the same size (slower)
verify = yes
; yes = the backup follows Proton: old copies of files moved on Proton are deleted, files deleted on Proton are moved to deleted_dir (empty it by hand)
cleanup = yes
; where cleanup moves the files deleted on Proton, one folder per date (empty = deleted/files next to the backup folder)
deleted_dir = 
; parallel calls to the CLI while scanning Proton
workers = 3
; files per download call
batch = 20
; seconds before a download call is given up (it's retried on the next run)
timeout = 1800

[photo-backup ssd]
; the photo backup folder (one subfolder per capture year), e.g. on an external disk
dest = /Volumes/MyBackupDisk/proton-photos
; yes = also rebuild every album as a folder of hard links to the photos
albums = yes
; where the album folders go: relative to dest, or an absolute path on the same disk (hard links can't cross disks)
album_dir = /Volumes/MyBackupDisk/proton-albums
; yes = the backup follows Proton: photos deleted on Proton are moved to deleted_dir (empty it by hand), extra copies of a photo are deleted, and album folders lose the photos no longer in the album
cleanup = yes
; where cleanup moves the photos deleted on Proton, one folder per date (empty = deleted/photos next to the backup folder)
deleted_dir = 
; photos per CLI call (bigger batches time out more)
batch = 5
; seconds before a CLI call is given up (failed photos are retried on the next run)
timeout = 300

[photo-compare camera]
; the local photo folder to check against Proton Photos (e.g. a Camera Uploads folder), searched recursively
folder = ~/Dropbox/Camera Uploads
; time zone of capture times written without one, e.g. Europe/Rome (empty = this Mac's)
tz = 
; seconds of tolerance on capture times (0 = exact)
tolerance = 1
; yes = read EXIF dates with exiftool when the file name has none
exif = yes
; yes = also write a script that uploads the missing photos
upload_script = yes
; photos per upload command in the upload script
batch = 20

[photo-redate ssd]
; file with one album name to leave alone per line (# for comments)
exclude_file = ~/excluded-albums.txt
; with --apply: seconds to wait before looking for the re-uploaded photos
wait = 20
; seconds before a CLI call is given up
timeout = 600
