# Profiles for the proton_backup scripts: one section per profile,
# named [<script> <profile>], e.g. [drive-compare dropbox] or [file-backup ssd].
# Run:   ./<script>.py <profile>   (or just ./<script>.py with a single profile)
# Edit:  ./<script>.py --setup <profile>, or by hand.
# Settings in [DEFAULT] apply to every profile.
#
# Copy this file to ~/.config/proton-backup/config.ini (or pass it with
# --config), or let --setup create it. Comments start with ';' or '#'.

[DEFAULT]
; the Proton folder to work on (/my-files is the whole Drive)
proton_root = /my-files

[drive-compare dropbox]
; the folder to compare with Proton (e.g. ~/Dropbox, or a copy on a disk)
folder = ~/Dropbox
; top-level subfolders to skip, comma-separated, exact names
exclude = Camera Uploads
; content = identical files verified by sha1 (slower, certain) | size = trust name and size
compare_by = content
; same file, different content: proton = keep Proton's, nothing to do | folder = copy the folder's over Proton's | newer = the most recently modified wins | ask = list it among the files to decide
winner = proton
; files found on Proton under another path or name: hide = count only | list = show them in the report
moved = hide
; files only on Proton: hide = count only | list = show them in the report
proton_only = hide
; yes = also put the files missing on Proton in the copy script
copy_script = no
; ask file by file at the end when at most this many need a decision (0 = never)
review_max = 20
; paths deleted from Proton on purpose, one per line, never reported again (empty = ~/.config/proton-backup/ignore-<profile>.txt)
ignore_file = 

[drive-compare disk]
; the folder to compare with Proton (e.g. ~/Dropbox, or a copy on a disk)
folder = /Volumes/MyBackupDisk/old-cloud-copy
; same file, different content: proton = keep Proton's, nothing to do | folder = copy the folder's over Proton's | newer = the most recently modified wins | ask = list it among the files to decide
winner = ask
; files found on Proton under another path or name: hide = count only | list = show them in the report
moved = list
; yes = also put the files missing on Proton in the copy script
copy_script = yes
; the local folder synced by the Proton Drive app matching proton_root (empty = found automatically)
proton_folder = 

[file-backup ssd]
; the backup folder, e.g. on an external disk
dest = /Volumes/MyBackupDisk/proton-files
; yes = recompute the sha1 of every local file: the only check that catches a corrupted file of the same size (slower)
verify = yes
; parallel calls to the CLI while scanning Proton
workers = 3
; files per download call
batch = 20
; seconds before a download call is given up (it's retried on the next run)
timeout = 1800
